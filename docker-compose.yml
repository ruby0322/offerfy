version: "2.3"

# Local stack: Postgres 16, SeaweedFS 3.76 (master/volume/filer/s3), backend, frontend.
# Intentionally omitted vs pd-care: LINE/LIFF, model-cache, Grafana, TLS gateway.
# Job catalog: docker compose run --rm backend python -m app.jobs.ingest_catalog

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: offerfy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${OFFERFY_POSTGRES_PASSWORD:-offerfy-local-dev-change-me}
    ports:
      - "${OFFERFY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d offerfy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  seaweedfs-master:
    image: chrislusf/seaweedfs:3.76
    command: "master -ip=seaweedfs-master -ip.bind=0.0.0.0 -mdir=/data"
    volumes:
      - seaweed-master-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  seaweedfs-volume:
    image: chrislusf/seaweedfs:3.76
    command: "volume -mserver=seaweedfs-master:9333 -ip=seaweedfs-volume -ip.bind=0.0.0.0 -dir=/data -max=0"
    depends_on:
      - seaweedfs-master
    volumes:
      - seaweed-volume-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  seaweedfs-filer:
    image: chrislusf/seaweedfs:3.76
    command: "filer -master=seaweedfs-master:9333 -ip=seaweedfs-filer -ip.bind=0.0.0.0 -defaultStoreDir=/data"
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_healthy
    volumes:
      - seaweed-filer-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8888/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  seaweedfs-s3:
    image: chrislusf/seaweedfs:3.76
    command: "s3 -filer=seaweedfs-filer:8888 -ip.bind=0.0.0.0 -port=8333 -domainName=seaweedfs-s3"
    depends_on:
      seaweedfs-filer:
        condition: service_healthy
    ports:
      - "${OFFERFY_S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8333/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${OFFERFY_POSTGRES_PASSWORD:-offerfy-local-dev-change-me}@postgres:5432/offerfy
      S3_ENDPOINT: http://seaweedfs-s3:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-seaweed-access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-seaweed-secret}
      S3_BUCKET: ${S3_BUCKET:-offerfy-private}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      BACKEND_INTERNAL_URL: http://backend:8000
      TYPST_PACKAGE_PATH: /app/typst/packages
      TYPST_FONT_PATHS: /app/fonts
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-change-me-auth}
      APP_ENV: ${APP_ENV:-development}
      UVICORN_HOST: ${UVICORN_HOST:-0.0.0.0}
      UVICORN_PORT: ${UVICORN_PORT:-8000}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    ports:
      - "${OFFERFY_BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "${OFFERFY_FRONTEND_PORT:-3100}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  seaweed-filer-data:
  seaweed-master-data:
  seaweed-volume-data:
