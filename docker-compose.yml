version: "2.3"

# Local stack: Postgres 16, SeaweedFS 3.76 (master/volume/filer/s3), backend, frontend.
# Intentionally omitted vs pd-care: LINE/LIFF, model-cache, Grafana, TLS gateway.
# Job catalog: docker compose run --rm backend python -m app.jobs.ingest_catalog

services:
  postgres:
    image: postgres:16-alpine
    # Both are startup parameters, so changing either needs a container
    # recreate (`docker compose up -d postgres`), not a restart.
    #
    # max_connections: the API's pool is 25 per worker (pool_size=15 +
    # max_overflow=10, see apps/backend/app/db.py and the reasoning there), so
    # 4 workers ceiling at 100. The three ingest timers run the same engine and
    # carry their own pool, worst case 3 x 25 = 75. Plus
    # superuser_reserved_connections (3) and room for a psql session: ~180.
    # 250 leaves real headroom; the stock 100 did not even cover the API.
    #
    # shared_buffers: the database is ~540 MB, so 1 GB holds it entirely. The
    # container has no memory limit and the host has tens of GB free. Stock was
    # 128 MB.
    command:
      - postgres
      - -c
      - max_connections=250
      - -c
      - shared_buffers=1GB
    environment:
      POSTGRES_DB: offerfy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${OFFERFY_POSTGRES_PASSWORD:-offerfy-local-dev-change-me}
    ports:
      # Loopback-only: DB must not be reachable off-host. Use an SSH tunnel
      # for remote access. In-stack consumers use docker DNS (postgres:5432).
      - "127.0.0.1:${OFFERFY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d offerfy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  seaweedfs-master:
    image: chrislusf/seaweedfs:3.76
    command: "master -ip=seaweedfs-master -ip.bind=0.0.0.0 -mdir=/data"
    volumes:
      - seaweed-master-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  seaweedfs-volume:
    image: chrislusf/seaweedfs:3.76
    command: "volume -mserver=seaweedfs-master:9333 -ip=seaweedfs-volume -ip.bind=0.0.0.0 -dir=/data -max=0"
    depends_on:
      - seaweedfs-master
    volumes:
      - seaweed-volume-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  seaweedfs-filer:
    image: chrislusf/seaweedfs:3.76
    command: "filer -master=seaweedfs-master:9333 -ip=seaweedfs-filer -ip.bind=0.0.0.0 -defaultStoreDir=/data"
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_healthy
    volumes:
      - seaweed-filer-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8888/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  seaweedfs-s3:
    image: chrislusf/seaweedfs:3.76
    command: "s3 -filer=seaweedfs-filer:8888 -ip.bind=0.0.0.0 -port=8333 -domainName=seaweedfs-s3"
    depends_on:
      seaweedfs-filer:
        condition: service_healthy
    ports:
      # Loopback-only: the object store holds private uploads and SeaweedFS S3
      # runs without credentials here, so it must never be reachable off-host.
      # In-cluster consumers use docker DNS (seaweedfs-s3:8333) and are unaffected.
      - "127.0.0.1:${OFFERFY_S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8333/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${OFFERFY_POSTGRES_PASSWORD:-offerfy-local-dev-change-me}@postgres:5432/offerfy
      S3_ENDPOINT: http://seaweedfs-s3:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-seaweed-access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-seaweed-secret}
      S3_BUCKET: ${S3_BUCKET:-offerfy-private}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      # No default: app.services.model_catalog.DEFAULT_MODEL owns it, and a
      # second copy of the default here is how the two come to disagree.
      # Replaces OPENAI_MODEL, which is no longer read -- a setting named
      # after one provider could not name a model from the other.
      CHAT_MODEL: ${CHAT_MODEL:-}
      BACKEND_INTERNAL_URL: http://backend:8000
      TYPST_PACKAGE_PATH: /app/typst/packages
      TYPST_FONT_PATHS: /app/fonts
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-change-me-auth}
      APP_ENV: ${APP_ENV:-development}
      UVICORN_HOST: ${UVICORN_HOST:-0.0.0.0}
      UVICORN_PORT: ${UVICORN_PORT:-8000}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    ports:
      # Loopback-only: public traffic arrives via the ingress, not this port.
      - "127.0.0.1:${OFFERFY_BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      # Loopback-only: public traffic arrives via the ingress, not this port.
      - "127.0.0.1:${OFFERFY_FRONTEND_PORT:-3100}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Load balancer in front of the host's Next.js instances, so the public
  # frontend can be restarted with no downtime. See
  # ops/nginx/offerfy-web-lb.conf for the reasoning and
  # docs/host-scaling-plan.md section 2.6 for the design.
  #
  # NOTE ON HARD RULE 9 (every `ports:` entry must be 127.0.0.1-prefixed): this
  # service has no `ports:` at all. `network_mode: host` means publishing does
  # not apply -- the bind is controlled by nginx's own `listen 192.168.49.1:3210`,
  # which is the minikube bridge and NOT the public NIC. Host networking is
  # required because the upstreams are host processes on 127.0.0.1:320x and the
  # listener has to be the address the cluster's Endpoints object points at.
  #
  # Unlike `backend`/`frontend` above, this service IS used for the public site.
  web-lb:
    image: nginx:1.27-alpine
    network_mode: host
    volumes:
      - ./ops/nginx/offerfy-web-lb.conf:/etc/nginx/nginx.conf:ro
      # A DIRECTORY, not a file: ops/rolling-restart-web.sh replaces the upstream
      # file by rename, and renaming over a bind-mounted *file* breaks the mount.
      - ./ops/nginx/upstream.d:/etc/nginx/upstream.d:ro
    # The image defaults to a 1024 fd limit, and nginx warns that
    # worker_connections 4096 "exceed open file resource limit: 1024". That is not
    # cosmetic here: every proxied request costs two descriptors, and an SSE chat
    # stream holds its pair open for the length of the model's answer, so 1024
    # would cap concurrent streams far below what the API can serve.
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3211/lb-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
  seaweed-filer-data:
  seaweed-master-data:
  seaweed-volume-data:
