apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: offerfy
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "15m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - offerfy.local
      secretName: offerfy-tls
  rules:
    - host: offerfy.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
