apiVersion: v1
kind: Secret
metadata:
  name: offerfy-secrets
type: Opaque
stringData:
  # Replace these before production-like use.
  # Overlay examples: k8s/overlays/dev/secret.yaml.example, k8s/overlays/prod/secret.yaml.example
  # Applied secrets (k8s/overlays/*/secret.yaml) are gitignored — never commit real credentials.
  OFFERFY_POSTGRES_PASSWORD: "offerfy-local-dev-change-me"
  DATABASE_URL: "postgresql+psycopg://postgres:offerfy-local-dev-change-me@postgres:5432/offerfy"
  S3_ACCESS_KEY: "seaweed-access"
  S3_SECRET_KEY: "seaweed-secret"
  AUTH_TOKEN_SECRET: "change-me-auth"
  GOOGLE_CLIENT_ID: "change-me-google-client-id"
  GOOGLE_CLIENT_SECRET: "change-me-google-client-secret"
  OPENAI_API_KEY: "change-me-openai-api-key"
  OPENAI_BASE_URL: "https://api.openai.com/v1"
