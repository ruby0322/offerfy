apiVersion: batch/v1
kind: CronJob
metadata:
  name: jobs-ingest
  labels:
    app: jobs-ingest
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: jobs-ingest
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: ingest
              image: offerfy-backend:latest
              imagePullPolicy: Always
              command: ["python3", "-m", "app.jobs.ingest_catalog"]
              envFrom:
                - configMapRef:
                    name: offerfy-config
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: offerfy-secrets
                      key: DATABASE_URL
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
