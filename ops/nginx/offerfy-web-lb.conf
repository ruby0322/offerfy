# Load balancer in front of the Offerfy Next.js instances, so the frontend can
# be restarted without downtime. Mounted at /etc/nginx/nginx.conf in the
# `web-lb` compose service.
#
# WHY THIS EXISTS
# `next start` is one process: it has to die before it can be replaced, which is
# the ~40 s outage AGENTS.md section 4 budgets for every frontend deploy. Several
# instances behind this proxy can be taken out of rotation one at a time instead.
#
# WHY NOT MULTIPLE ENDPOINTS SUBSETS
# Tried on 2026-11-16 and it cannot work: the EndpointSliceMirroring controller
# flattens every subset into ONE EndpointSlice with a single shared `ports` list,
# and two subsets must both name their port `http` (the Service port is named
# `http` and resolution is by name), so the slice fails validation with
# "ports[1].name: Duplicate value". See docs/host-scaling-plan.md section 2.1.
#
# WHY :3210 AND NOT :3200
# Port 3200 belongs to `offerfy-web.service`, a *system* unit with
# Restart=always. Freeing it would need root, which agent sessions do not have.
# So this listens on 3210 and keeps 3200 as one of its backends; the Ingress
# Endpoints object points at 3210.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $upstream_addr is the point of this log: it is how we PROVE requests are
    # spread across instances, rather than inferring it from config. The ingress
    # has its own access log and its own problems (no host field, client IP is
    # always the pod gateway), so this one is deliberately about upstreams.
    log_format  lb  '$remote_addr -> $upstream_addr "$request" '
                    '$status ${upstream_response_time}s';
    access_log  /var/log/nginx/access.log  lb;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Match the Ingress's nginx.ingress.kubernetes.io/proxy-body-size: 15m, which
    # is in turn in step with MAX_UPLOAD_MB=10. A smaller value here would reject
    # uploads the Ingress had already accepted.
    client_max_body_size 15m;

    # `Connection: upgrade` only when the client actually asked for an upgrade;
    # otherwise the header must be empty, because sending "upgrade"
    # unconditionally breaks keepalive to the upstream. Must be inside `http`.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Which instances are in rotation. Generated/rewritten by
    # ops/rolling-restart-web.sh -- a whole DIRECTORY is mounted, not a single
    # file, because replacing a bind-mounted file by rename breaks the mount.
    include /etc/nginx/upstream.d/*.conf;

    server {
        # Bind the minikube bridge ONLY. Never 0.0.0.0: docker publishes through
        # its own iptables chains and does not honour the UFW INPUT policy, so a
        # wildcard bind here would put the frontend on the public NIC. This is
        # the same hazard docs/deploy.md hard rule 9 is about -- it just cannot
        # be expressed as a `127.0.0.1:` ports prefix, because network_mode:host
        # means there is no `ports:` mapping at all.
        listen 192.168.49.1:3210;
        server_name _;

        location / {
            proxy_pass http://offerfy_web;

            # HTTP/1.1 is required for keepalive to the upstream and for SSE.
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            # Append rather than overwrite: the Ingress has already put the real
            # client in here, and replacing it would lose it.
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            # SSE. The chat stream is server-sent events and a turn can run for
            # minutes; nginx's default proxy_read_timeout is 60 s, which would
            # cut answers off mid-sentence. These match the Ingress's own
            # proxy-read-timeout/proxy-send-timeout of 3600.
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            # Buffering would hold SSE frames until a buffer filled, so the user
            # would see a long pause and then a wall of text.
            proxy_buffering     off;
            proxy_cache         off;

            # A drained or dead instance fails at connect, before anything is
            # sent, so retrying the next upstream is safe. `non_idempotent` is
            # deliberately NOT listed: a POST that was already delivered must not
            # be replayed. The rolling restart drains explicitly instead, so
            # there is nothing in flight to retry.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 2s;
        }
    }

    # The proxy's own health, on loopback only, so it does NOT become a public
    # endpoint on offerfy.cc. Checking this separates "nginx is down" from
    # "every Next instance is down", which the public path cannot distinguish.
    server {
        listen 127.0.0.1:3211;
        server_name _;
        location = /lb-health {
            access_log off;
            return 200 "ok\n";
        }
        location / { return 404; }
    }
}
